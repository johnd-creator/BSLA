name: reliability-cockpit-platform

x-python-common: &python-common
  restart: unless-stopped
  networks: [platform]

services:
  maximo-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: maximo_collector
      POSTGRES_USER: maximo_collector
      POSTGRES_PASSWORD: ${MAXIMO_DB_PASSWORD:?set in .env.platform}
    volumes: [maximo-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maximo_collector -d maximo_collector"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]

  pi-db:
    image: timescale/timescaledb:2.16.1-pg16
    environment:
      POSTGRES_DB: pi_collector
      POSTGRES_USER: pi_collector
      POSTGRES_PASSWORD: ${PI_DB_PASSWORD:?set in .env.platform}
    volumes: [pi-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_collector -d pi_collector"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]

  cems-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: cems_collector
      POSTGRES_USER: cems_collector
      POSTGRES_PASSWORD: ${CEMS_DB_PASSWORD:?set in .env.platform}
    volumes: [cems-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cems_collector -d cems_collector"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]

  cockpit-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: cockpit
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: ${COCKPIT_DB_PASSWORD:?set in .env.platform}
    volumes: [cockpit-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]

  maximo-init:
    <<: *python-common
    build: ./maximo-collector
    restart: "no"
    command: ["mxcollector", "init-db"]
    environment:
      DATABASE_URL: postgresql+psycopg://maximo_collector:${MAXIMO_DB_PASSWORD}@maximo-db/maximo_collector
    depends_on:
      maximo-db: {condition: service_healthy}

  maximo-worker:
    <<: *python-common
    build: ./maximo-collector
    command: ["mxcollector", "run", "--operational-interval-seconds", "${MAXIMO_OPERATIONAL_INTERVAL_SECONDS:-300}", "--asset-interval-seconds", "${MAXIMO_ASSET_INTERVAL_SECONDS:-21600}"]
    environment:
      DATABASE_URL: postgresql+psycopg://maximo_collector:${MAXIMO_DB_PASSWORD}@maximo-db/maximo_collector
      MAXIMO_BASE_URL: ${MAXIMO_BASE_URL}
      MAXIMO_AUTH_MODE: ${MAXIMO_AUTH_MODE:-login}
      MAXIMO_USERNAME: ${MAXIMO_USERNAME:-}
      MAXIMO_PASSWORD: ${MAXIMO_PASSWORD:-}
      MAXIMO_READ_ONLY_TOKEN: ${MAXIMO_READ_ONLY_TOKEN:-}
      MAXIMO_SESSION_COOKIE: ${MAXIMO_SESSION_COOKIE:-}
    depends_on:
      maximo-init: {condition: service_completed_successfully}

  maximo-api:
    <<: *python-common
    build: ./maximo-collector
    environment:
      DATABASE_URL: postgresql+psycopg://maximo_collector:${MAXIMO_DB_PASSWORD}@maximo-db/maximo_collector
    depends_on:
      maximo-init: {condition: service_completed_successfully}

  pi-init:
    <<: *python-common
    build: ./pi-collector
    restart: "no"
    command: ["picollector", "init-db"]
    environment:
      PI_CONFIG_MODE: managed
      DATABASE_URL: postgresql+psycopg://pi_collector:${PI_DB_PASSWORD}@pi-db/pi_collector
    depends_on:
      pi-db: {condition: service_healthy}

  pi-api:
    <<: *python-common
    build: ./pi-collector
    environment:
      # Non-secret pause metadata only; no PI URL/auth config.
      PI_SNAPSHOT_INTERVAL_SECONDS: ${PI_SNAPSHOT_INTERVAL_SECONDS:-300}
      PI_CONFIG_MODE: managed
      DATABASE_URL: postgresql+psycopg://pi_collector:${PI_DB_PASSWORD}@pi-db/pi_collector
    depends_on:
      pi-init: {condition: service_completed_successfully}

  # Deliberate operator path: status by default; --apply only after backup.
  pi-migrate:
    <<: *python-common
    profiles: [pi-maintenance]
    build: ./pi-collector
    restart: "no"
    command: ["picollector", "migrate"]
    environment:
      PI_CONFIG_MODE: managed
      DATABASE_URL: postgresql+psycopg://pi_collector:${PI_DB_PASSWORD}@pi-db/pi_collector
    depends_on:
      pi-db: {condition: service_healthy}

  # Enable only after the one-attribute source canary succeeds and all external
  # schedules are disabled. No registry reload/prune or history job on startup.
  pi-worker:
    <<: *python-common
    profiles: [pi-collection]
    build: ./pi-collector
    restart: "no"
    command: ["picollector", "worker", "--pause-seconds", "${PI_SNAPSHOT_INTERVAL_SECONDS:-300}"]
    environment:
      # Only source-boundary worker receives source settings from .env.platform.
      PI_CONFIG_MODE: managed
      PI_WEB_API_BASE_URL: ${PI_WEB_API_BASE_URL:-}
      PI_USERNAME: ${PI_USERNAME:-}
      PI_PASSWORD: ${PI_PASSWORD:-}
      PI_TOKEN: ${PI_TOKEN:-}
      PI_TIMEOUT_SECONDS: ${PI_TIMEOUT_SECONDS:-30}
      PI_RATE_LIMIT_SECONDS: ${PI_RATE_LIMIT_SECONDS:-1.0}
      PI_MAX_RESPONSE_BYTES: ${PI_MAX_RESPONSE_BYTES:-1048576}
      PI_VERIFY_TLS: ${PI_VERIFY_TLS:-1}
      # Compatibility name: post-cycle pause, never fixed-rate start cadence.
      PI_SNAPSHOT_INTERVAL_SECONDS: ${PI_SNAPSHOT_INTERVAL_SECONDS:-300}
      DATABASE_URL: postgresql+psycopg://pi_collector:${PI_DB_PASSWORD}@pi-db/pi_collector
    depends_on:
      pi-db: {condition: service_healthy}

  cems-init:
    <<: *python-common
    # Legacy persistence is opt-in; never run alongside the volatile PLC reader.
    profiles: [cems-legacy-storage]
    build: ./cems-collector
    restart: "no"
    command: ["sh", "-c", "cemscollector init-db && cemscollector load-registry"]
    environment:
      DATABASE_URL: postgresql://cems_collector:${CEMS_DB_PASSWORD}@cems-db/cems_collector
    depends_on:
      cems-db: {condition: service_healthy}

  cems-worker:
    <<: *python-common
    # Legacy persistence is opt-in; never run alongside the volatile PLC reader.
    profiles: [cems-legacy-storage]
    restart: "no"
    build: ./cems-collector
    command: ["cemscollector", "collect"]
    environment:
      DATABASE_URL: postgresql://cems_collector:${CEMS_DB_PASSWORD}@cems-db/cems_collector
      CEMS_MODBUS_HOST: ${CEMS_MODBUS_HOST}
      CEMS_MODBUS_PORT: ${CEMS_MODBUS_PORT:-502}
    depends_on:
      cems-init: {condition: service_completed_successfully}

  cems-aggregator:
    <<: *python-common
    # Legacy persistence is opt-in; never run alongside the volatile PLC reader.
    profiles: [cems-legacy-storage]
    restart: "no"
    build: ./cems-collector
    command: ["cemscollector", "run-aggregator", "--interval-seconds", "${CEMS_AGGREGATION_INTERVAL_SECONDS:-300}"]
    environment:
      DATABASE_URL: postgresql://cems_collector:${CEMS_DB_PASSWORD}@cems-db/cems_collector
    depends_on:
      cems-init: {condition: service_completed_successfully}

  cems-api:
    <<: *python-common
    # Legacy persistence is opt-in; never run alongside the volatile PLC reader.
    profiles: [cems-legacy-storage]
    restart: "no"
    build: ./cems-collector
    environment:
      DATABASE_URL: postgresql://cems_collector:${CEMS_DB_PASSWORD}@cems-db/cems_collector
    depends_on:
      cems-init: {condition: service_completed_successfully}

  # Existing Mart only: status/ready never initializes tables or acquires sources.
  mart-ready:
    <<: *python-common
    build: ./reliability-cockpit
    restart: "no"
    command: ["cockpit", "mart-migrate", "--require-ready"]
    environment:
      COCKPIT_CONFIG_MODE: managed
      RELIABILITY_MART_ADMIN_DATABASE_URL: ${RELIABILITY_MART_ADMIN_DATABASE_URL:?set existing Mart writer in .env.platform}
      RELIABILITY_MART_EXPECT_DATABASE: ${RELIABILITY_MART_EXPECT_DATABASE:?set existing Mart database name}
    depends_on:
      maximo-db: {condition: service_healthy}

  mart-migrate:
    <<: *python-common
    profiles: [mart-maintenance]
    build: ./reliability-cockpit
    restart: "no"
    command: ["cockpit", "mart-migrate"]
    environment:
      COCKPIT_CONFIG_MODE: managed
      RELIABILITY_MART_ADMIN_DATABASE_URL: ${RELIABILITY_MART_ADMIN_DATABASE_URL:?set existing Mart writer in .env.platform}
      RELIABILITY_MART_EXPECT_DATABASE: ${RELIABILITY_MART_EXPECT_DATABASE:?set existing Mart database name}
    depends_on:
      maximo-db: {condition: service_healthy}

  mart-reader:
    <<: *python-common
    profiles: [mart-maintenance]
    build: ./reliability-cockpit
    restart: "no"
    command: ["cockpit", "mart-reader"]
    environment:
      COCKPIT_CONFIG_MODE: managed
      RELIABILITY_MART_ADMIN_DATABASE_URL: ${RELIABILITY_MART_ADMIN_DATABASE_URL:?set existing Mart writer in .env.platform}
      RELIABILITY_MART_EXPECT_DATABASE: ${RELIABILITY_MART_EXPECT_DATABASE:?set existing Mart database name}
      RELIABILITY_MART_READER_PASSWORD: ${RELIABILITY_MART_READER_PASSWORD:-}
    depends_on:
      maximo-db: {condition: service_healthy}

  mart-projector:
    <<: *python-common
    build: ./maximo-collector
    # Local incremental projection only. Preserve reviewed WO runtime override.
    command: ["sh", "-c", 'while true; do mxcollector mart-project --incremental; sleep "$${MART_PROJECTION_INTERVAL_SECONDS}"; done']
    environment:
      DATABASE_URL: postgresql+psycopg://maximo_collector:${MAXIMO_DB_PASSWORD}@maximo-db/maximo_collector
      RELIABILITY_MART_DATABASE_URL: ${RELIABILITY_MART_ADMIN_DATABASE_URL:?set existing Mart writer in .env.platform}
      RELIABILITY_CONTRACTS_ROOT: /contracts
      MART_PROJECTION_INTERVAL_SECONDS: ${MART_PROJECTION_INTERVAL_SECONDS:-300}
    volumes: [./reliability-data-contracts:/contracts:ro]
    depends_on:
      maximo-db: {condition: service_healthy}
      mart-ready: {condition: service_completed_successfully}

  cockpit-init:
    <<: *python-common
    build: ./reliability-cockpit
    restart: "no"
    command: ["cockpit", "init-db"]
    environment:
      COCKPIT_CONFIG_MODE: managed
      DATABASE_URL: postgresql+psycopg://cockpit:${COCKPIT_DB_PASSWORD}@cockpit-db/cockpit
    depends_on:
      cockpit-db: {condition: service_healthy}

  cockpit-worker:
    <<: *python-common
    build: ./reliability-cockpit
    command: ["cockpit", "run", "--interval-seconds", "${COCKPIT_SYNC_INTERVAL_SECONDS:-300}"]
    environment:
      COCKPIT_CONFIG_MODE: managed
      DATABASE_URL: postgresql+psycopg://cockpit:${COCKPIT_DB_PASSWORD}@cockpit-db/cockpit
      MAXIMO_COLLECTOR_API_BASE: ${MAXIMO_COLLECTOR_API_BASE:-http://maximo-api:8002}
      PI_COLLECTOR_API_BASE: ${PI_COLLECTOR_API_BASE:-http://pi-api:8001}
      CEMS_COLLECTOR_API_BASE: ${CEMS_COLLECTOR_API_BASE:-http://cems-api:8003}
    depends_on:
      cockpit-init: {condition: service_completed_successfully}
      maximo-api: {condition: service_started}

  cockpit-api:
    <<: *python-common
    build: ./reliability-cockpit
    environment:
      COCKPIT_CONFIG_MODE: managed
      MAXIMO_COLLECTOR_API_BASE: ${MAXIMO_COLLECTOR_API_BASE:-http://maximo-api:8002}
      PI_COLLECTOR_API_BASE: ${PI_COLLECTOR_API_BASE:-http://pi-api:8001}
      NADI_COLLECTOR_MAX_AGE_SECONDS: ${NADI_COLLECTOR_MAX_AGE_SECONDS:-}
      NADI_SOURCE_MAX_AGE_SECONDS: ${NADI_SOURCE_MAX_AGE_SECONDS:-}
      NADI_PROJECTION_MAX_AGE_SECONDS: ${NADI_PROJECTION_MAX_AGE_SECONDS:-}
      NADI_MAXIMO_WO_MAX_AGE_SECONDS: ${NADI_MAXIMO_WO_MAX_AGE_SECONDS:-}
      NADI_MART_FACTUAL_PROJECTION_MAX_AGE_SECONDS: ${NADI_MART_FACTUAL_PROJECTION_MAX_AGE_SECONDS:-}
      NADI_PI_COLLECTOR_MAX_AGE_SECONDS: ${NADI_PI_COLLECTOR_MAX_AGE_SECONDS:-}
      NADI_CONDITION_SOURCE_MAX_AGE_SECONDS: ${NADI_CONDITION_SOURCE_MAX_AGE_SECONDS:-}
      NADI_CONDITION_PROJECTION_MAX_AGE_SECONDS: ${NADI_CONDITION_PROJECTION_MAX_AGE_SECONDS:-}
      # Reliability Mart remains in the existing Maximo collector DB.
      RELIABILITY_MART_DATABASE_URL: ${RELIABILITY_MART_DATABASE_URL:?set SELECT-only existing Mart DSN in .env.platform}
      DATABASE_URL: postgresql+psycopg://cockpit:${COCKPIT_DB_PASSWORD}@cockpit-db/cockpit
    depends_on:
      cockpit-init: {condition: service_completed_successfully}
      mart-ready: {condition: service_completed_successfully}

  cockpit-web:
    build: ./reliability-cockpit/web
    restart: unless-stopped
    environment:
      COCKPIT_API_BASE: http://cockpit-api:8000
    depends_on:
      cockpit-api: {condition: service_started}
    networks: [platform]
    ports: ["${COCKPIT_WEB_PORT:-3000}:3000"]

networks:
  platform:
    driver: bridge

volumes:
  maximo-db:
  pi-db:
  cems-db:
  cockpit-db:
