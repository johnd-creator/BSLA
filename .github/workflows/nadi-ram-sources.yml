name: NADI RAM sources
on:
  pull_request:
    paths: ['NADI/historian/**', 'NADI/tests/Historian/**', 'cems-collector/**', 'compose.yaml', '.github/workflows/nadi-ram-sources.yml']
  push:
    branches: [main]
    paths: ['NADI/historian/**', 'NADI/tests/Historian/**', 'cems-collector/**', 'compose.yaml', '.github/workflows/nadi-ram-sources.yml']
permissions:
  contents: read
jobs:
  offline:
    name: RAM sources / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ./cems-collector
      - name: CEMS fake transports and RAM only
        working-directory: cems-collector
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests
      - name: Historian fake source and temporary loopback only
        working-directory: NADI
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests/Historian
      - name: No generated source changes
        run: git diff --exit-code
